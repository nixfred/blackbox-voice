<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660" role="img" aria-labelledby="t d"><title id="t">Blackbox Voice</title><desc id="d">Audio travels from a pocket recorder through a private local transcription pipeline into a dated text archive, while the source audio disappears after success.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#05090d"/><stop offset="1" stop-color="#101624"/></linearGradient></defs><rect width="1600" height="660" rx="34" fill="url(#bg)"/><g font-family="system-ui,sans-serif"><text x="90" y="105" fill="#7c8b9a" font-size="24" letter-spacing="8">PRIVATE AMBIENT MEMORY PIPELINE</text><text x="90" y="195" fill="#f2f6f8" font-size="72" font-weight="250">BLACKBOX VOICE</text><text x="92" y="244" fill="#8594a2" font-size="25">Record the day. Keep the words. Destroy the audio.</text></g><g transform="translate(85 315)"><rect width="240" height="210" rx="28" fill="#111b25" stroke="#3d5362" stroke-width="3"/><circle cx="120" cy="72" r="32" fill="#d95050"/><g stroke="#d95050" stroke-width="5"><path d="M50 145v-25M75 160v-55M100 150v-35M125 168V94M150 150v-35M175 160v-55M200 145v-25"/></g><text x="120" y="198" text-anchor="middle" fill="#8fa0ac" font-family="ui-monospace,monospace" font-size="17">IC RECORDER</text></g><g stroke="#48c7e8" stroke-width="4" fill="none"><path d="M360 420h210"/><path d="m550 405 20 15-20 15"/></g><g transform="translate(610 315)"><rect width="360" height="210" rx="28" fill="#0d2227" stroke="#3cbf9d" stroke-width="3"/><text x="180" y="55" text-anchor="middle" fill="#3fe0b7" font-family="ui-monospace,monospace" font-size="20">LOCAL HOST</text><g fill="#edf7f4" font-family="system-ui,sans-serif" font-size="21"><text x="45" y="105">Whisper transcription</text><text x="45" y="142">Atomic archive write</text><text x="45" y="179">Audio shred on success</text></g></g><g stroke="#48c7e8" stroke-width="4" fill="none"><path d="M1010 420h210"/><path d="m1200 405 20 15-20 15"/></g><g transform="translate(1260 315)"><rect width="255" height="210" rx="28" fill="#17172a" stroke="#8e78d8" stroke-width="3"/><g fill="#a792e8"><rect x="42" y="45" width="170" height="14" rx="4"/><rect x="42" y="80" width="150" height="10" rx="4"/><rect x="42" y="108" width="180" height="10" rx="4"/><rect x="42" y="136" width="125" height="10" rx="4"/></g><text x="128" y="190" text-anchor="middle" fill="#9b9bad" font-family="ui-monospace,monospace" font-size="17">YYYY/MM/DD</text></g><text x="800" y="615" text-anchor="middle" fill="#61717d" font-family="ui-monospace,monospace" font-size="18">audio is temporary · text is searchable · the operator stays in control</text></svg>
